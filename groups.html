<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xi4Seat • Group Maker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

    <header id="main-header" class="scrolled">
        <a href="index.html" class="logo">
            <span class="logo-text">FOUR<span class="accent-text">ENSIC</span></span>
        </a>
        <div class="mobile-menu-btn" onclick="document.querySelector('.nav-menu').classList.toggle('active')">
            <i class="fas fa-bars"></i>
        </div>
        <nav class="nav-menu">
            <ul>
                <li><a href="index.html">Beranda</a></li>
                <li><a href="shuffler.html">Seating</a></li>
                <li><a href="groups.html" style="color: var(--accent);">Groups</a></li>
                <li><a href="history.html">Riwayat</a></li>
            </ul>
        </nav>
    </header>

    <section class="features-section" style="padding-top: 120px; min-height: 100vh;">
        <div class="section-title">
            <h2>Group <span class="accent-text">Maker</span></h2>
            <p>Bagi kelas XI-4 menjadi beberapa kelompok secara acak</p>
            
            <div class="group-controls" style="background: transparent; border: none; box-shadow: none;">
                <div class="input-group">
                    <label for="group-count">Jumlah Kelompok:</label>
                    <input type="number" id="group-count" min="2" max="20" value="4" style="background-color: var(--secondary-bg); border-color: rgba(255,255,255,0.1); color: var(--text-white);">
                </div>
                <button id="generate-groups-btn" class="btn">Buat Kelompok</button>
                <button id="download-groups-btn" class="btn btn-outline" style="display: none;">Unduh Gambar</button>
            </div>
        </div>

        <div class="groups-grid-container" style="max-width: 1200px; margin: 0 auto; padding: 0 5%;">
            <div class="groups-grid" id="groups-container">
                <!-- Groups will be rendered here -->
                <div class="empty-state">
                    <p>Masukkan jumlah kelompok dan klik tombol di atas untuk memulai.</p>
                </div>
            </div>
        </div>
    </section>

    <script src="groups.js"></script>
</body>

</html>
